name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: unorank_testing
          MYSQL_USER: unorank_test
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: unorank_testing
      DB_USERNAME: unorank_test
      DB_PASSWORD: test-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, dom, xml, xmlwriter, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: php artisan test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./bin/setup.sh
      - run: curl --fail http://localhost:8000/up
      - run: docker compose --profile test run --rm test
