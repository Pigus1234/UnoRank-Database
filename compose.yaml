name: unorank-backend
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - app-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-unorank}
      MYSQL_USER: ${DB_USERNAME:-unorank}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run bin/setup.sh first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run bin/setup.sh first}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  test:
    build: .
    profiles: [test]
    command: ["php", "artisan", "test"]
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY:?Run bin/setup.sh first}
      CACHE_STORE: array
      SESSION_DRIVER: array
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_DATABASE: unorank_testing
      DB_USERNAME: unorank_test
      DB_PASSWORD: test-only-password
    depends_on:
      mysql-test:
        condition: service_healthy
  mysql-test:
    image: mysql:8.4
    profiles: [test]
    environment:
      MYSQL_DATABASE: unorank_testing
      MYSQL_USER: unorank_test
      MYSQL_PASSWORD: test-only-password
      MYSQL_ROOT_PASSWORD: test-only-root-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql-data:
  app-storage:
